<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 990" width="1600" height="990" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57534E"/>
    </marker>
    <marker id="setaClara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8A29E"/>
    </marker>
    <marker id="setaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803D"/>
    </marker>
    <marker id="setaVermelha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
    <marker id="setaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="990" fill="#FAFAF9"/>

  <!-- ============ Titulo ============ -->
  <text x="80" y="62" font-size="30" font-weight="700" fill="#1C1917">Da modelagem ao contrato classificado</text>
  <text x="80" y="92" font-size="16" fill="#78716C">Harness determinístico para classificação de privacidade em contratos ODCS</text>

  <!-- ============ Faixa 1 — Modelagem ============ -->
  <text x="80" y="146" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.5">1 · MODELAGEM</text>

  <rect x="80" y="162" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="200" y="190" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle">Dev / Data Owner</text>
  <text x="200" y="210" font-size="12" fill="#78716C" text-anchor="middle">quem conhece o dado</text>

  <line x1="330" y1="193" x2="418" y2="193" stroke="#57534E" stroke-width="1.5" marker-end="url(#seta)"/>

  <rect x="430" y="162" width="270" height="62" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="565" y="190" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle">Editor ODCS</text>
  <text x="565" y="210" font-size="12" fill="#78716C" text-anchor="middle">container · acessível por link</text>

  <line x1="710" y1="193" x2="798" y2="193" stroke="#57534E" stroke-width="1.5" marker-end="url(#seta)"/>

  <rect x="810" y="162" width="290" height="62" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="955" y="187" font-size="15" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">contrato.odcs.yaml</text>
  <text x="955" y="208" font-size="12" fill="#78716C" text-anchor="middle">estrutura, não dado</text>

  <!-- commit -->
  <line x1="1100" y1="193" x2="1210" y2="193" stroke="#57534E" stroke-width="1.5" marker-end="url(#seta)"/>
  <rect x="1220" y="168" width="150" height="50" rx="25" fill="#1C1917"/>
  <text x="1295" y="198" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="Consolas, monospace">git commit</text>

  <!-- divisor -->
  <line x1="80" y1="262" x2="1520" y2="262" stroke="#A8A29E" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="620" y="248" width="360" height="28" rx="14" fill="#FAFAF9"/>
  <text x="800" y="267" font-size="13" font-weight="600" fill="#78716C" text-anchor="middle">a partir daqui, nada é manual</text>

  <!-- ============ Faixa 2 — Harness ============ -->
  <text x="80" y="312" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.5">2 · HARNESS</text>

  <!-- teto -->
  <path d="M 91 344 L 91 334 L 1509 334 L 1509 344" fill="none" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="690" y="318" width="220" height="30" rx="15" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="800" y="338" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">teto de passos: 12</text>

  <!-- 9 fases -->
  <g>
    <rect x="91" y="370" width="138" height="66" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="160" y="410" font-size="16" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="Consolas, monospace">start</text>
    <polygon points="233,398 247,403 233,408" fill="#57534E"/>

    <rect x="251" y="370" width="138" height="66" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="320" y="410" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">plan</text>
    <polygon points="393,398 407,403 393,408" fill="#57534E"/>

    <rect x="411" y="370" width="138" height="66" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="480" y="410" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">bearings</text>
    <polygon points="553,398 567,403 553,408" fill="#57534E"/>

    <rect x="571" y="370" width="138" height="66" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="640" y="410" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">smoke</text>
    <polygon points="713,398 727,403 713,408" fill="#57534E"/>

    <rect x="731" y="370" width="138" height="66" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="800" y="410" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">pick</text>
    <polygon points="873,398 887,403 873,408" fill="#57534E"/>

    <rect x="891" y="370" width="138" height="66" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="960" y="410" font-size="15" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">implement</text>
    <polygon points="1033,398 1047,403 1033,408" fill="#57534E"/>

    <rect x="1051" y="370" width="138" height="66" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="1120" y="410" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">verify</text>
    <polygon points="1193,398 1207,403 1193,408" fill="#57534E"/>

    <rect x="1211" y="370" width="138" height="66" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="1280" y="410" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">handoff</text>
    <polygon points="1353,398 1367,403 1353,408" fill="#57534E"/>

    <rect x="1371" y="370" width="138" height="66" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="1440" y="410" font-size="16" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="Consolas, monospace">stop</text>
  </g>

  <text x="80" y="466" font-size="12" fill="#A8A29E">ordem fixa · sem retorno · sem pulo de fase</text>

  <!-- tres saidas -->
  <line x1="1440" y1="440" x2="1440" y2="492" stroke="#15803D" stroke-width="1.8" marker-end="url(#setaVerde)"/>
  <rect x="1240" y="498" width="280" height="58" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/>
  <text x="1380" y="522" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">PASS · exit 0</text>
  <text x="1380" y="542" font-size="12" fill="#166534" text-anchor="middle">feature concluída, commit criado</text>

  <line x1="640" y1="440" x2="640" y2="492" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#setaVermelha)"/>
  <rect x="500" y="498" width="280" height="58" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="640" y="522" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle">FAIL · exit 1</text>
  <text x="640" y="542" font-size="12" fill="#991B1B" text-anchor="middle">para na fase que falhou, não avança</text>

  <line x1="960" y1="440" x2="960" y2="492" stroke="#B45309" stroke-width="2.5" marker-end="url(#setaAmbar)"/>
  <rect x="810" y="498" width="300" height="58" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
  <text x="960" y="522" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">AGUARDA HUMANO · exit 5</text>
  <text x="960" y="542" font-size="12" fill="#92400E" text-anchor="middle">reclassificação sensível não passa sozinha</text>

  <line x1="160" y1="440" x2="160" y2="492" stroke="#57534E" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#seta)"/>
  <rect x="80" y="498" width="280" height="58" rx="8" fill="#F5F5F4" stroke="#78716C" stroke-width="1.5"/>
  <text x="220" y="522" font-size="15" font-weight="700" fill="#57534E" text-anchor="middle">TETO · exit 3</text>
  <text x="220" y="542" font-size="12" fill="#57534E" text-anchor="middle">estourou o limite, aborta</text>

  <!-- ============ Faixa 3 — Evidencia ============ -->
  <text x="80" y="612" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.5">3 · EVIDÊNCIA</text>

  <line x1="300" y1="626" x2="300" y2="656" stroke="#A8A29E" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#setaClara)"/>
  <line x1="800" y1="626" x2="800" y2="656" stroke="#A8A29E" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#setaClara)"/>
  <line x1="1300" y1="626" x2="1300" y2="656" stroke="#A8A29E" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#setaClara)"/>

  <rect x="140" y="662" width="320" height="76" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="300" y="692" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">state/</text>
  <text x="300" y="714" font-size="12" fill="#78716C" text-anchor="middle">lista de features e cursor</text>

  <rect x="640" y="662" width="320" height="76" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="800" y="692" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">trace/</text>
  <text x="800" y="714" font-size="12" fill="#78716C" text-anchor="middle">cada transição, duração, exit code</text>

  <rect x="1140" y="662" width="320" height="76" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="1300" y="692" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle" font-family="Consolas, monospace">evidence/</text>
  <text x="1300" y="714" font-size="12" fill="#78716C" text-anchor="middle">saída bruta das ferramentas</text>

  <rect x="140" y="756" width="1320" height="40" rx="8" fill="#1C1917"/>
  <text x="800" y="782" font-size="14" font-weight="600" fill="#FAFAF9" text-anchor="middle">O trace guarda nome de campo, decisão e justificativa. Nunca o valor do dado.</text>

  <!-- ============ Features ============ -->
  <text x="80" y="844" font-size="12" font-weight="700" fill="#A8A29E" letter-spacing="1.5">UMA FEATURE POR VEZ, DO INÍCIO AO FIM</text>

  <rect x="80" y="858" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="100" y="890" font-size="14" font-weight="700" fill="#1D4ED8">F1</text>
  <text x="132" y="890" font-size="13" fill="#1C1917">Validar contra o padrão ODCS</text>

  <rect x="440" y="858" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="460" y="890" font-size="14" font-weight="700" fill="#1D4ED8">F2</text>
  <text x="492" y="890" font-size="13" fill="#1C1917">Mapear ao glossário canônico</text>

  <rect x="800" y="858" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="820" y="890" font-size="14" font-weight="700" fill="#1D4ED8">F3</text>
  <text x="852" y="890" font-size="13" fill="#1C1917">Classificar PII/LGPD por campo</text>

  <rect x="1160" y="858" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="1180" y="890" font-size="14" font-weight="700" fill="#B45309">F4</text>
  <text x="1212" y="890" font-size="13" fill="#1C1917">Gate humano + relatório</text>

  <text x="80" y="952" font-size="12" fill="#A8A29E">9 fases · teto de 12 passos · 0 campos classificados sem evidência</text>
  <text x="1520" y="952" font-size="12" fill="#A8A29E" text-anchor="end">github.com/bitol-io · datacontract.com</text>
</svg>
