[package]
name = "harness-odcs"
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
description = "Harness de desenvolvimento incremental para classificacao de privacidade de contratos ODCS"
publish = false
# Esta versao e a tag do release sao **a mesma coisa**, e o workflow de release
# reprova quando divergem. Sem essa trava, `Cargo.toml` viraria um numero
# decorativo — foi o que aconteceu: ficou em 0.1.0 durante cinco releases.

# Split lib/bin proposital: sem a lib, `tests/` nao alcanca a maquina de
# estados e o criterio "determinismo testavel" fica sem prova. A politica
# vive na lib; o bin so faz CLI e exit code.
[lib]
name = "harness"
path = "src/lib.rs"

[[bin]]
name = "harness-odcs"
path = "src/main.rs"

[dependencies]
# Estado e trace em JSON/JSONL.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI e help do ponto de entrada.
clap = { version = "4", features = ["derive"] }
# Erros com contexto.
anyhow = "1"
# Timestamps ISO-8601 em UTC para o trace.
time = { version = "0.3", features = ["formatting", "macros"] }
# Hash da evidencia. Precisa ser estavel entre versoes, o que exclui o
# DefaultHasher da std (SipHash sem garantia de estabilidade).
sha2 = "0.10"
# Glossario canonico (F2) em YAML. Fork mantido do serde_yaml, que o autor
# arquivou em 2024 — a alternativa seria carregar o glossario em JSON, o que
# transferiria o custo para quem edita o arquivo a mao. O harness nao parseia
# ODCS com isto: quem interpreta contrato e o datacontract-cli.
serde_norway = "0.9.42"
