# O gate humano — a decisao que a esteira nao pode tomar.
#
# ATENCAO: este workflow e uma **simulacao** do controle real, montada para
# exercitar o mecanismo numa conta pessoal, onde o GitHub nao deixa ninguem
# aprovar o proprio pull request e times de organizacao nao existem.
#
#   simulacao  →  alguem com escrita aplica o rotulo `governanca-aprovada`
#   real       →  quem o CODEOWNERS nomeia aprova a revisao do pull request
#
# O que a simulacao preserva: um ato humano **deliberado, distinto e
# registrado**, que o CI verifica e nao pode praticar. O que ela nao prova:
# segregacao de papeis — voce aplicando o proprio rotulo e auto-aprovacao. Isso
# so vem de CODEOWNERS com times reais, ou de grupos do Entra ID no Azure
# DevOps.
#
# Como adaptar para o cenario real: trocar a condicao do passo `decisao`. O
# bloco esta marcado com REAL abaixo, e o resto do desenho nao se move.

name: gate

# `labeled` e `unlabeled` sao o que fazem aplicar o rotulo **redisparar** a
# verificacao. Sem eles, o status ficaria congelado no que era verdade quando o
# pull request abriu, e o rotulo nao destravaria nada.
#
# Workflow separado do `contrato` de proposito: aquele roda containers, e
# redispara-lo a cada mudanca de rotulo custaria uma verificacao inteira por
# clique. Este le uma etiqueta e responde em segundos.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  decisao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- O que esta em decisao ---------------------------------------------
      #
      # "Aguardando decisao humana" nao diz **o que** se esta decidindo. Quem
      # abria o job lia a instrucao de ir ler o laudo em outro lugar, e a
      # instrucao saia como texto no log — o pior lugar possivel para um ponteiro.
      #
      # A fonte e o `.proposta.json` que a esteira **commitou** ao lado do laudo,
      # e nao uma segunda verificacao: rodar o harness aqui custaria container a
      # cada clique em rotulo, que e a razao de este workflow existir separado.
      #
      # Nem o `report.json` da evidencia: ele vive num artefato de 30 dias e num
      # outro run, enquanto isto esta versionado ao lado do contrato e e o
      # proprio documento que o revisor esta aprovando.
      #
      # O casamento e por sha256, e nao pelo nome do arquivo: o nome carrega o
      # sha truncado, e comparar o campo e exato.
      - name: o que esta em decisao
        run: |
          set -eu
          achou=0
          {
            echo "## Pendencias de decisao humana"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for contrato in $(git ls-files 'contracts/**/contract.odcs.yaml'); do
            dir=$(dirname "$contrato")
            sha=$(sha256sum "$contrato" | cut -d' ' -f1)

            proposta=''
            for p in "$dir"/laudos/*.proposta.json; do
              [ -f "$p" ] || continue
              [ "$(jq -r '.contrato_sha256' "$p")" = "$sha" ] || continue
              proposta="$p"
              break
            done

            [ -n "$proposta" ] || continue
            [ "$(jq '.gate | length' "$proposta")" != "0" ] || continue
            achou=1

            {
              echo "### \`$contrato\`"
              echo
              jq -r '"Glossario v\(.glossario_versao) · catalogo v\(.catalogo_versao) · pedido `\(.gate_sha256[0:16])`"' "$proposta"
              echo

              # O laudo casa pelo sha do **contrato**, e o contrato pode nao
              # ter mudado num pull request que so sobe o pin. Ai a tabela e
              # verdadeira sobre o que foi decidido, e desatualizada sobre a
              # regua — e aprovar sem saber disso e aprovar a coisa errada.
              fixada=$(. ./harness.lock >/dev/null 2>&1; echo "${HARNESS_VOCAB_VERSAO:-}")
              emitida=$(jq -r '.glossario_versao' "$proposta")
              case "$fixada" in
                *"$emitida"*) ;;
                '') ;;
                *)
                  echo "> **Laudo emitido sob outra regua.** Esta tabela vem de um laudo"
                  echo "> gerado com glossario v$emitida, e o \`harness.lock\` fixa"
                  echo "> \`$fixada\`. A esteira \`contrato\` reemite o laudo nesta"
                  echo "> branch — o que esta abaixo vale para o criterio antigo."
                  echo
                  ;;
              esac

              echo "| Tipo | Campo | O que esta em decisao |"
              echo "|---|---|---|"
              jq -r '.gate[] | "| `\(.tipo)` | `\(.campo)` | \(.detalhe) |"' "$proposta"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

          # A ausencia tem duas causas e elas pedem acoes diferentes, entao a
          # mensagem nao pode ser uma so. O caso comum e corrida: este workflow
          # responde em segundos e o `contrato` leva minutos, entao no primeiro
          # run o laudo desta versao **ainda nao foi commitado**.
          if [ "$achou" = "0" ]; then
            {
              echo "Nenhuma pendencia encontrada nos laudos commitados desta versao."
              echo
              echo "Se a esteira \`contrato\` ainda esta rodando, o laudo desta versao"
              echo "ainda nao foi emitido — este passo reavalia quando o rotulo for"
              echo "aplicado. O laudo completo sai no comentario do pull request."
              echo
              echo "[Ver a conversa do pull request](${{ github.event.pull_request.html_url }})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: decisao humana registrada
        env:
          ROTULO: governanca-aprovada
          # SIMULACAO: os rotulos vem do evento. Como `labeled` esta nos types,
          # o evento e sempre recente.
          ROTULOS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # --- REAL: substituir este bloco por
          #
          #   decisao=$(gh pr view "$PR" --json reviewDecision -q .reviewDecision)
          #   [ "$decisao" = "APPROVED" ] || { erro; exit 1; }
          #
          # com `pull-requests: read` e `GH_TOKEN` no ambiente. A branch
          # protection exigindo revisao de CODEOWNER ja faria isso sozinha — este
          # job existe para que o **status check** tambem reflita a decisao, e
          # nao so o botao de merge.
          case ",$ROTULOS," in
            *",$ROTULO,"*)
              echo "::notice::decisao humana registrada — rotulo \`$ROTULO\` aplicado"
              exit 0
              ;;
          esac

          # O mesmo recado no resumo do job, logo abaixo da tabela que o
          # passo anterior escreveu — e ali que a pessoa esta olhando, e nao
          # no log.
          {
            echo "---"
            echo
            echo "### Aguardando decisao humana"
            echo
            echo "Este pull request altera contrato de dados. Para liberar o merge:"
            echo
            echo "1. leia o laudo no [comentario da esteira](${{ github.event.pull_request.html_url }}), campo a campo"
            echo "2. confira a tabela acima — lacuna segue **sem classificacao** no contrato"
            echo "3. aplique o rotulo \`$ROTULO\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::aguardando decisao humana"
          echo
          echo "Este pull request altera contrato de dados e precisa de uma decisao"
          echo "registrada antes do merge."
          echo
          echo "  1. leia o laudo no comentario da esteira, campo a campo"
          echo "  2. confira as lacunas: elas seguem sem classificacao no contrato"
          echo "  3. aplique o rotulo \`$ROTULO\`"
          echo
          echo "No cenario real este passo e a aprovacao de quem o CODEOWNERS"
          echo "nomeia — ver .github/README.md no repositorio do harness."
          exit 1
