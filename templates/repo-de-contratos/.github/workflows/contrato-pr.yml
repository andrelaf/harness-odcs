# Verificacao de contrato de dados em pull request.
#
# Este repositorio nao tem Rust, nao tem `src/`, nao tem glossario e nao tem
# catalogo de classificacao. Tem contratos — e so.
#
# A ferramenta que julga vem de fora, fixada por **versao e sha256**, e traz o
# criterio consigo. Tres consequencias, e sao elas que justificam o desenho:
#
#   1. Quem escreve o contrato nao escreve o criterio que o julga. Nao por
#      convencao nem por CODEOWNERS bem preenchido: por nao ter o arquivo.
#   2. O veredito e reproduzivel. Subir a versao do pacote e um commit neste
#      repositorio, revisado como qualquer outro — nunca um efeito de alguem ter
#      publicado algo em outro lugar.
#   3. Este YAML nao decide nada. Ele baixa, confere o hash e chama. Toda a
#      politica esta no binario, testada la.

name: contrato

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contrato-pr.yml'

# `contents: write` porque **o laudo e emitido aqui**, e nao na maquina de quem
# escreve o contrato.
#
# Quem redige o contrato mexe no YAML e mais nada: nao precisa de Docker, nao
# precisa do pacote de validacao, nao emite documento de governanca. O laudo
# nasce sempre no ambiente controlado, com a versao fixada em `harness.lock` —
# o que ele afirma nao depende do que estava instalado na maquina de ninguem.
#
# A escrita e estreita, e a esteira nao escolhe o que grava: ela roda `aplicar`,
# que so escreve o contrato enriquecido e os arquivos em `laudos/`, e commita na
# branch do pull request. Na `main` ela nao consegue empurrar — a branch
# protection exige revisao, e um job nao e revisor.
#
# O commit acontece **antes** da aprovacao, de proposito. Depois dela, o push
# derrubaria a revisao que acabou de ser dada (`dismiss stale approvals`), e
# todo pull request passaria a exigir duas aprovacoes para o mesmo conteudo.
# Assim o revisor aprova uma vez, olhando exatamente o que vai entrar.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contrato-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Onde esta o criterio, para todos os passos de uma vez. O pacote da
    # ferramenta nao carrega mais o vocabulario, e sem esta variavel o harness
    # cairia no default — o proprio diretorio dele — e pararia dizendo que nao
    # achou o glossario.
    #
    # No job, e nao repetida em cada passo que chama o binario: duas copias
    # divergiriam no dia em que um passo novo fosse acrescentado sem ela, e o
    # sintoma seria um veredito emitido sob outro criterio.
    env:
      HARNESS_VOCAB: ${{ runner.temp }}/harness-vocab
    steps:
      # `ref` explicito: o padrao do evento `pull_request` e o merge commit, que
      # e desanexado. Para commitar de volta e preciso estar **na branch**.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # Qual criterio julga este repositorio — repo, versao e sha256. Vive em
      # `harness.lock` e nao neste YAML porque quem roda a verificacao na
      # propria maquina le o mesmo arquivo. Duas declaracoes divergiriam no dia
      # em que uma das duas subisse de versao.
      # --- 1. A ferramenta ---------------------------------------------------
      #
      # `. ./harness.lock` em cada passo que precisa do pin, e nao um filtro
      # para `$GITHUB_ENV`. A primeira versao filtrava com `grep -E '^[A-Z_]+='`
      # e **descartava em silencio** a linha `HARNESS_SHA256=` — `[A-Z_]` nao
      # inclui digito, e o nome da variavel tem `256`. O download funcionava, a
      # conferencia recebia um hash vazio, e o erro falava de formato de
      # checksum: tres passos de distancia da causa.
      #
      # O arquivo ja e `sh` valido e o script local dele (`scripts/preparar.sh`)
      # sempre o carregou assim. Ler o mesmo arquivo de duas maneiras diferentes
      # era a divergencia entre CI e maquina de dev que o pin existe para
      # impedir.
      #
      # `gh release download` em vez de `curl`: funciona igual em repositorio
      # privado, que e onde isto vai acabar morando.
      - name: baixar o pacote de validacao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./harness.lock
          gh release download "$HARNESS_VERSAO" \
            --repo "$HARNESS_REPO" \
            --pattern 'harness-odcs-linux-x64.tar.gz' \
            --dir "$RUNNER_TEMP"

      # A verificacao que da sentido ao "fixado". Sem ela, `HARNESS_VERSAO`
      # seria uma etiqueta, e etiqueta se move.
      #
      # Comparacao explicita em vez de `sha256sum --check`: quando reprova, o
      # que interessa e **quais** sao os dois valores. `--check` responde
      # "FAILED" e deixa quem le o log adivinhar se o pacote mudou ou se o pin
      # esta errado.
      - name: conferir o sha256
        run: |
          . ./harness.lock
          [ -n "$HARNESS_SHA256" ] || {
            echo "::error::HARNESS_SHA256 vazio ou ausente em harness.lock"
            exit 1
          }
          obtido="$(sha256sum "$RUNNER_TEMP/harness-odcs-linux-x64.tar.gz" | cut -d' ' -f1)"
          if [ "$obtido" != "$HARNESS_SHA256" ]; then
            echo "::error::o pacote baixado nao e o fixado em harness.lock"
            echo "  esperado : $HARNESS_SHA256"
            echo "  obtido   : $obtido"
            exit 1
          fi
          echo "sha256 confere: $obtido"

      - name: extrair
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/harness-odcs-linux-x64.tar.gz"

      # --- 1b. O criterio ----------------------------------------------------
      #
      # Os mesmos tres passos, para o outro pin. O vocabulario nao vem dentro do
      # pacote da ferramenta porque muda em outra cadencia: acrescentar um termo
      # nao deveria exigir publicar um binario, e o dono do glossario nao
      # deveria depender da fila do dono do codigo.
      #
      # Repetir a sequencia aqui e deliberado. Um passo generico parametrizado
      # economizaria dez linhas e esconderia qual dos dois pins reprovou, que e
      # a unica coisa que interessa quando um deles reprova.
      - name: baixar o vocabulario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./harness.lock
          gh release download "$HARNESS_VOCAB_VERSAO" \
            --repo "$HARNESS_VOCAB_REPO" \
            --pattern 'harness-vocab.tar.gz' \
            --dir "$RUNNER_TEMP"

      - name: conferir o sha256 do vocabulario
        run: |
          . ./harness.lock
          [ -n "$HARNESS_VOCAB_SHA256" ] || {
            echo "::error::HARNESS_VOCAB_SHA256 vazio ou ausente em harness.lock"
            exit 1
          }
          obtido="$(sha256sum "$RUNNER_TEMP/harness-vocab.tar.gz" | cut -d' ' -f1)"
          if [ "$obtido" != "$HARNESS_VOCAB_SHA256" ]; then
            echo "::error::o vocabulario baixado nao e o fixado em harness.lock"
            echo "  esperado : $HARNESS_VOCAB_SHA256"
            echo "  obtido   : $obtido"
            exit 1
          fi
          echo "sha256 confere: $obtido"

      - name: extrair o vocabulario
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/harness-vocab.tar.gz"

      # A procedencia, no log do job: de um lado versao do harness e commit; do
      # outro, versao e sha256 do glossario e do catalogo que vao julgar este
      # contrato. Duas respostas separadas para duas perguntas separadas.
      - name: procedencia
        run: |
          cat "$RUNNER_TEMP/harness-odcs/VERSION"
          echo
          cat "$RUNNER_TEMP/harness-vocab/VERSION"

      # --- 2. O motor de validacao -------------------------------------------
      #
      # Puxa a imagem do datacontract-cli e confere o digest. A regra esta
      # dentro do pacote, nao aqui: repetir a verificacao neste YAML criaria uma
      # segunda fonte de verdade sobre qual imagem e a certa.
      - name: preparar o motor de validacao
        run: "$RUNNER_TEMP/harness-odcs/scripts/imagem.sh"

      # --- 3. Quais contratos este pull request toca --------------------------
      #
      # Um repositorio de contratos tem N contratos, e um pull request costuma
      # mexer em um. Verificar os 200 a cada push custaria 200 vezes a partida
      # de container — e 99,6% do custo medido deste harness e exatamente isso.
      #
      # O `check` recusa escolher sozinho quando ha ambiguidade (exit 4), e faz
      # bem: adivinhar qual contrato classificar e a decisao errada para tomar
      # em silencio. Quem sabe o alvo aqui e o **git**, nao o contrato — por
      # isso a selecao mora neste YAML, e nao no binario.
      - name: contratos alterados
        id: alvos
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          alterados=$(git diff --name-only --diff-filter=d             "origin/${{ github.base_ref }}...HEAD"             -- 'contracts/**/contract.odcs.yaml' || true)

          # Mudanca so no workflow ou no pin: o alvo passa a ser **todo**
          # contrato, porque o criterio que os julga pode ter mudado.
          if [ -z "$alterados" ]; then
            alterados=$(find contracts -name contract.odcs.yaml 2>/dev/null | sort)
            echo "nenhum contrato no diff — verificando todos, o criterio pode ter mudado"
          fi

          [ -n "$alterados" ] || { echo "repositorio sem contratos"; exit 0; }
          echo "$alterados"
          echo "$alterados" > "$RUNNER_TEMP/alvos.txt"

      # --- 4. Verificar e emitir, contrato a contrato -------------------------
      #
      # O laudo e emitido **pela esteira**, e nao na maquina de quem escreveu o
      # contrato: e documento de governanca, e o que ele afirma nao pode
      # depender do que estava instalado em lugar nenhum.
      #
      # Reprovacao real (lint, nome, composicao) nao emite nada — sem proposta
      # valida nao ha o que registrar, e quem corrige e quem abriu o PR.
      - name: verificar e emitir
        id: check
        run: |
          set -u
          pior=0
          emitiu=nao
          : > "$RUNNER_TEMP/comentario.md"

          while IFS= read -r alvo; do
            [ -n "$alvo" ] || continue
            echo "::group::$alvo"
            relatorio="$RUNNER_TEMP/report-$(echo "$alvo" | tr '/' '-').json"

            set +e
            "$RUNNER_TEMP/harness-odcs/harness.sh" check --contrato "$alvo"               --formato github --saida "$relatorio"
            codigo=$?
            set -e

            # Pendencia de aplicacao e o sinal de que o laudo ainda nao existe
            # para este conteudo. `aplicar` e idempotente, mas custa container:
            # chamar a toa dobraria o custo do job em todo push.
            if [ -f "$relatorio" ]; then
              pendente=$(jq -r '[.defeitos[] | select(.etapa == "aplicacao")] | length' "$relatorio")
              if [ "$pendente" != "0" ] && [ "$codigo" != "4" ]; then
                "$RUNNER_TEMP/harness-odcs/harness.sh" aplicar --contrato "$alvo" || true
                emitiu=sim
                # Reverifica o que acabou de ser escrito. **Push com
                # GITHUB_TOKEN nao dispara workflow**, entao a execucao
                # seguinte nao existe e verde aqui seria verde sem verificacao.
                set +e
                "$RUNNER_TEMP/harness-odcs/harness.sh" check --contrato "$alvo"                   --formato github --saida "$relatorio"
                codigo=$?
                set -e
              fi
              "$RUNNER_TEMP/harness-odcs/harness.sh" report "$relatorio" \
                --formato markdown >> "$RUNNER_TEMP/comentario.md"
              # Separador entre contratos, para o comentario nao virar um bloco
              # unico quando o pull request toca mais de um.
              echo >> "$RUNNER_TEMP/comentario.md"
              echo '---' >> "$RUNNER_TEMP/comentario.md"
              echo >> "$RUNNER_TEMP/comentario.md"
            else
              echo "::error::sem relatorio para $alvo (exit $codigo)"
            fi

            # O veredito do job e o pior dos contratos: um reprovado no meio de
            # nove aprovados nao pode sair verde.
            [ "$codigo" -gt "$pior" ] && pior=$codigo
            echo "::endgroup::"
          done < "$RUNNER_TEMP/alvos.txt"

          echo "codigo=$pior" >> "$GITHUB_OUTPUT"
          echo "emitiu=$emitiu" >> "$GITHUB_OUTPUT"

      - name: commitar o laudo
        id: laudo
        if: steps.check.outputs.emitiu == 'sim'
        run: |
          # `git add` restrito: o que a esteira pode gravar sao contratos e
          # laudos, e nada mais.
          git add contracts/
          if git diff --cached --quiet; then
            echo "nada mudou no repositorio"
            exit 0
          fi
          git config user.name  "contrato[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit             -m "chore: laudo de classificacao emitido pela esteira"             -m "Gerado por \`harness aplicar\` no pacote fixado em harness.lock, e nao na maquina de quem escreveu o contrato: o que este documento afirma nao depende do que estava instalado em lugar nenhum."             -m "Este commit precede a revisao de proposito. Emitido depois dela, derrubaria a aprovacao recem-dada e o mesmo conteudo exigiria duas aprovacoes."
          git push origin "HEAD:${{ github.head_ref }}"

      # O comentario e o resumo saem do mesmo arquivo montado no laco: um
      # bloco por contrato, na ordem em que foram verificados. Com um contrato
      # so, e identico ao de antes.
      - name: resumo do job
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/comentario.md" ] || {
            echo "sem relatorio — a verificacao nao chegou a rodar" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          cat "$RUNNER_TEMP/comentario.md" >> "$GITHUB_STEP_SUMMARY"

      - name: comentar no pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -s "$RUNNER_TEMP/comentario.md" ] || { echo "nada a comentar"; exit 0; }

          # O comentario do GitHub aceita 65536 caracteres, e cada contrato
          # ocupa ~5 KB — mais quando ha lacuna e o vocabulario entra. Passar do
          # limite nao trunca: a API recusa, e o pull request fica **sem
          # comentario nenhum**. O desfecho pior aparece justamente no pull
          # request grande, que e o que mais precisa do comentario.
          #
          # Num repositorio com dezenas de contratos isto deixa de ser hipotese:
          # um bump de `HARNESS_VOCAB_VERSAO` faz o alvo virar **todos** eles.
          LIMITE=60000
          corpo="$RUNNER_TEMP/corpo.md"
          if [ "$(wc -c < "$RUNNER_TEMP/comentario.md")" -gt "$LIMITE" ]; then
            head -c "$LIMITE" "$RUNNER_TEMP/comentario.md" > "$corpo"
            {
              echo
              echo '---'
              echo
              echo '**Comentario truncado** — este pull request toca contratos demais para'
              echo 'caber no limite de 65536 caracteres. O relatorio completo de cada'
              echo 'contrato esta no artefato `evidencia-'"$GITHUB_RUN_ID"'`.'
            } >> "$corpo"
          else
            cp "$RUNNER_TEMP/comentario.md" "$corpo"
          fi

          gh pr comment "$PR" --body-file "$corpo" --edit-last             || gh pr comment "$PR" --body-file "$corpo"

      # A saida bruta das ferramentas, para depurar uma execucao que reprovou.
      #
      # `trace/` nao sobe: ele e o rastro da **maquina de estados** do harness,
      # que serve ao ciclo de construcao dele e nao diz nada sobre um contrato.
      # Os dois diretorios ainda aparecem no checkout porque o container escreve
      # dentro do volume montado — sao ignorados pelo git, e some-los de vez
      # exigiria montar um segundo volume.
      # E sobe **so quando reprova**, e nao a cada push.
      #
      # No caminho feliz ela e redundante duas vezes: o laudo foi **commitado**
      # nesta branch pelo passo `aplicar`, e o corpo dele ainda vai no
      # comentario do pull request. Guardar 226 KB por contrato para duplicar o
      # que ja esta no diff e custo sem leitor — e num repositorio com 200
      # contratos, um bump de `HARNESS_VOCAB_VERSAO` torna o alvo **todos**
      # eles: ~45 MB a cada push.
      #
      # Quando reprova de verdade e o oposto: **nada e emitido**, porque sem
      # proposta valida nao ha laudo a registrar. Ai a saida bruta do container
      # e o unico material que existe.
      #
      # `5` — gate aberto — nao conta como reprovar: o laudo existe e esta no
      # comentario. Codigo vazio conta, porque significa que a verificacao nem
      # chegou a rodar.
      - name: artefatos
        if: >-
          always() && (failure()
          || steps.check.outputs.codigo == ''
          || (steps.check.outputs.codigo != '0' && steps.check.outputs.codigo != '5'))
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: ignore

      # `5` — gate aberto — nao reprova: nada esta errado no contrato, falta
      # decisao humana. Quem segura o merge e a revisao de CODEOWNER.
      #
      # O codigo aqui ja e o pior entre os contratos verificados, e ja considera
      # a reverificacao do que a esteira emitiu.
      - name: veredito
        run: |
          case "${{ steps.check.outputs.codigo }}" in
            0) echo "contrato aprovado na verificacao automatica" ;;
            5) echo "::notice::aguardando decisao humana — o merge fica com a revisao de CODEOWNER" ;;
            *) echo "::error::verificacao reprovou (exit ${{ steps.check.outputs.codigo }})"; exit 1 ;;
          esac
