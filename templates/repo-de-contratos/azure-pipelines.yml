# Verificacao de contrato de dados em pull request — Azure DevOps.
#
# Irmao de `.github/workflows/contrato-pr.yml`, e deliberadamente parecido com
# ele: os dois chamam **os mesmos comandos**, na mesma ordem, e nenhum dos dois
# decide nada. Toda a politica esta no binario, testada la, e roda igual na
# maquina de quem escreve o contrato.
#
# E por isso que a porta entre as duas plataformas custa um arquivo: o que muda
# e como o resultado e desenhado, nunca o que ele afirma.
#
# ATENCAO — este arquivo ainda nao foi exercitado num pipeline real, e isso
# pesa mais do que parece: a versao do GitHub, tambem "revisada e nunca
# executada", trazia tres defeitos que so apareceram no primeiro run — crase
# escapada dentro de um filtro `jq`, `runner.temp` num escopo onde o contexto
# nao existe, e clone raso derrubando a selecao de alvos em silencio. Nenhum era
# visivel lendo o arquivo.
#
# Trate o que esta aqui como estrutura correta, nao como codigo testado.
#
# Os pontos onde as duas plataformas divergem estao marcados com `# DIVERGE`. A
# que mais custa esta no passo `resumo`: **nao ha comentario no pull request**.

trigger: none

# DIVERGE: no GitHub, `on: pull_request` basta. No Azure DevOps a validacao de
# pull request e configurada na **branch policy** da branch de destino, e nao
# aqui. Este bloco cobre o caso de o pipeline ser chamado por PR de repositorio
# do proprio Azure Repos.
pr:
  branches:
    include: [main]
  paths:
    include:
      - contracts/*
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-latest

# Onde esta o criterio. O pacote da ferramenta nao carrega mais o vocabulario —
# ele tem release e pin proprios —, e sem esta variavel o harness cairia no
# default, que e o proprio diretorio dele, e pararia dizendo que nao achou o
# glossario.
#
# Variavel de pipeline em vez de `export` em cada passo: o Azure a entrega como
# variavel de ambiente para todo `script`, e uma copia por passo divergiria no
# dia em que alguem acrescentasse um passo sem ela.
variables:
  HARNESS_VOCAB: $(Agent.TempDirectory)/harness-vocab

steps:
  - checkout: self
    # DIVERGE: necessario para o passo que commita o laudo de volta na branch.
    persistCredentials: true
    # O passo `contratos alterados` compara com a base, e num clone raso nao ha
    # merge-base — a comparacao sai `fatal: bad revision` e a selecao de alvos
    # degrada para "verifica todos" sem dizer que degradou. No GitHub isso
    # aconteceu de verdade, em todo pull request, ate alguem medir.
    fetchDepth: 0

  # --- 1. A ferramenta ---------------------------------------------------
  #
  # DIVERGE: `gh release download` nao existe aqui. `curl` resolve enquanto o
  # repositorio do harness for publico; sendo privado, troque por uma chamada
  # autenticada a API de releases, ou publique o pacote num feed de artefatos
  # do proprio Azure DevOps.
  - script: |
      set -eu
      . ./harness.lock
      curl -fsSL -o "$(Agent.TempDirectory)/harness.tar.gz" \
        "https://github.com/$HARNESS_REPO/releases/download/$HARNESS_VERSAO/harness-odcs-linux-x64.tar.gz"
    displayName: baixar o pacote de validacao

  - script: |
      set -eu
      . ./harness.lock
      obtido="$(sha256sum "$(Agent.TempDirectory)/harness.tar.gz" | cut -d' ' -f1)"
      if [ "$obtido" != "$HARNESS_SHA256" ]; then
        echo "##vso[task.logissue type=error]o pacote baixado nao e o fixado em harness.lock"
        echo "  esperado : $HARNESS_SHA256"
        echo "  obtido   : $obtido"
        exit 1
      fi
      echo "sha256 confere: $obtido"
    displayName: conferir o sha256

  - script: |
      set -eu
      tar -C "$(Agent.TempDirectory)" -xzf "$(Agent.TempDirectory)/harness.tar.gz"
      cat "$(Agent.TempDirectory)/harness-odcs/VERSION"
    displayName: extrair e mostrar a procedencia

  # --- 1b. O criterio ----------------------------------------------------
  #
  # Os mesmos tres passos, para o outro pin. E aqui esta a resposta pratica
  # para "isto funciona no Azure?": funciona porque o mecanismo escolhido foi
  # `curl` + `sha256sum` + `tar`, que existem em qualquer agente. Nao ha
  # `checkout` multi-repo, nao ha service connection, nao ha feed de
  # artefatos — nada que exista de um lado so.
  #
  # DIVERGE: vale o mesmo aviso do pacote da ferramenta. `curl` resolve
  # enquanto o repositorio do vocabulario for publico; sendo privado, troque
  # por chamada autenticada. E o mesmo problema de sempre, agora em dobro —
  # nao um problema novo.
  - script: |
      set -eu
      . ./harness.lock
      curl -fsSL -o "$(Agent.TempDirectory)/harness-vocab.tar.gz" \
        "https://github.com/$HARNESS_VOCAB_REPO/releases/download/$HARNESS_VOCAB_VERSAO/harness-vocab.tar.gz"
    displayName: baixar o vocabulario

  - script: |
      set -eu
      . ./harness.lock
      obtido="$(sha256sum "$(Agent.TempDirectory)/harness-vocab.tar.gz" | cut -d' ' -f1)"
      if [ "$obtido" != "$HARNESS_VOCAB_SHA256" ]; then
        echo "##vso[task.logissue type=error]o vocabulario baixado nao e o fixado em harness.lock"
        echo "  esperado : $HARNESS_VOCAB_SHA256"
        echo "  obtido   : $obtido"
        exit 1
      fi
      echo "sha256 confere: $obtido"
    displayName: conferir o sha256 do vocabulario

  - script: |
      set -eu
      tar -C "$(Agent.TempDirectory)" -xzf "$(Agent.TempDirectory)/harness-vocab.tar.gz"
      cat "$(Agent.TempDirectory)/harness-vocab/VERSION"
    displayName: extrair o vocabulario e mostrar a procedencia

  # --- 2. O motor de validacao -------------------------------------------
  - script: "$(Agent.TempDirectory)/harness-odcs/scripts/imagem.sh"
    displayName: preparar o motor de validacao

  # --- 3. Os alvos --------------------------------------------------------
  #
  # O `check` **recusa escolher sozinho** quando ha mais de um contrato e
  # ninguem passou `--contrato`: sai `4`, e antes de escrever o `--saida`. E a
  # decisao certa — adivinhar qual contrato classificar seria errar em silencio
  # —, mas significa que a esteira precisa escolher, e ate agora este arquivo
  # nao escolhia. Com dois contratos no repositorio ele saia `4` sempre.
  #
  # DIVERGE: a base do pull request vem de `System.PullRequest.TargetBranch`, no
  # formato `refs/heads/main`. O GitHub entrega `github.base_ref` ja sem prefixo.
  - script: |
      set -eu
      base="$(System.PullRequest.TargetBranch)"
      base="${base#refs/heads/}"
      git fetch --quiet origin "$base"

      # Sem `|| true`: falhar e devolver vazio querem coisas opostas. Vazio e
      # legitimo — o pull request nao toca contrato, o que mudou foi codigo ou
      # criterio, e ai verificar todos e o certo. Falhar significa que a
      # comparacao nao aconteceu, e verificar todos vira custo escondido atras
      # de uma mensagem que afirma outra coisa.
      if ! alterados=$(git diff --name-only --diff-filter=d             "origin/$base...HEAD" -- 'contracts/**/contract.odcs.yaml'); then
        echo "##vso[task.logissue type=error]nao consegui comparar com origin/$base — o checkout tem historico suficiente? Precisa de fetchDepth: 0"
        exit 1
      fi

      # `--diff-filter=d` exclui o que foi **removido**. Sem ele um pull request
      # que apaga um contrato coloca o caminho apagado na lista, o `check`
      # reprova com "contrato nao existe" e o job fica vermelho por ter feito
      # exatamente o que foi pedido.
      if [ -z "$alterados" ]; then
        alterados=$(find contracts -name contract.odcs.yaml | sort)
        echo "nenhum contrato no diff — verificando todos, o criterio pode ter mudado"
      fi
      [ -n "$alterados" ] || { echo "repositorio sem contratos"; exit 1; }

      echo "$alterados"
      echo "$alterados" > "$(Agent.TempDirectory)/alvos.txt"
    displayName: contratos alterados

  # --- 4. Verificar e emitir, contrato a contrato -------------------------
  #
  # `--formato azure` emite `##vso[task.logissue ...]`, que prende a anotacao ao
  # arquivo em vez de deixa-la no log do job. E o irmao de `--formato github`, e
  # a unica diferenca entre as duas plataformas: a politica, o veredito e o
  # `report.json` sao os mesmos.
  #
  # DIVERGE: a identidade que commita e a conta de build do projeto, e ela
  # precisa de "Contribute" na branch. No GitHub isso e `contents: write`.
  - script: |
      set -u
      HARNESS="$(Agent.TempDirectory)/harness-odcs/harness.sh"
      TMP="$(Agent.TempDirectory)"
      pior=0
      emitiu=nao
      : > "$TMP/comentario.md"

      git config user.name  "contrato-bot"
      git config user.email "contrato-bot@$(Build.Repository.Name)"

      while IFS= read -r alvo; do
        [ -n "$alvo" ] || continue
        echo "== $alvo =="
        relatorio="$TMP/report-$(echo "$alvo" | tr '/' '-').json"

        set +e
        "$HARNESS" check --contrato "$alvo" --formato azure --saida "$relatorio"
        codigo=$?
        set -e

        # Pendencia de aplicacao e o sinal de que o laudo desta versao ainda nao
        # existe. `aplicar` e idempotente, mas custa container — so roda quando
        # ha o que escrever.
        if [ -f "$relatorio" ]; then
          pendente=$(jq -r '[.defeitos[] | select(.etapa == "aplicacao")] | length' "$relatorio")
          if [ "$pendente" != "0" ]; then
            set +e
            "$HARNESS" aplicar --contrato "$alvo"
            set -e
            emitiu=sim
            "$HARNESS" check --contrato "$alvo" --formato azure --saida "$relatorio"
            codigo=$?
          fi
          # O desenho sai do relatorio gravado, e nao de uma terceira
          # verificacao: 99,6% do custo medido e partida de container.
          "$HARNESS" report "$relatorio" --formato markdown >> "$TMP/comentario.md"
          echo >> "$TMP/comentario.md"
        else
          # `check` nem chegou a julgar — erro de ambiente ou de uso. Dizer isso
          # e melhor que um resumo sem a linha do contrato.
          {
            echo "### \`$alvo\`"
            echo
            echo "A verificacao nao produziu relatorio (exit \`$codigo\`). Veja o log do job."
            echo
          } >> "$TMP/comentario.md"
        fi

        # O pior veredito manda: um contrato reprovado nao fica escondido atras
        # de outro que passou. `4` (erro) tem precedencia sobre `1` (reprovou),
        # que tem sobre `5` (aguarda decisao).
        case "$codigo" in
          4) pior=4 ;;
          1) [ "$pior" = 4 ] || pior=1 ;;
          5) [ "$pior" = 0 ] && pior=5 ;;
        esac
      done < "$TMP/alvos.txt"

      echo "##vso[task.setvariable variable=codigo]$pior"
      echo "##vso[task.setvariable variable=emitiu]$emitiu"
    displayName: verificar e emitir

  # O commit acontece **antes** da aprovacao, de proposito. Depois dela, o push
  # derrubaria a revisao recem-dada e o mesmo conteudo exigiria duas aprovacoes.
  - script: |
      set -eu
      git add contracts/
      git diff --cached --quiet && { echo "nada a commitar"; exit 0; }
      git commit -m "chore: laudo de classificacao emitido pela esteira"
      git push origin "HEAD:$(System.PullRequest.SourceBranch)"
    displayName: commitar o laudo
    condition: and(succeeded(), eq(variables['emitiu'], 'sim'))

  # --- 5. O resultado -----------------------------------------------------
  #
  # DIVERGE, e esta e a divergencia que mais custa: **nao ha comentario no pull
  # request.** No GitHub o laudo inteiro vai no comentario, que e onde o revisor
  # ja esta olhando. Aqui ele vai para o resumo do job, que exige um clique a
  # mais.
  #
  # Postar exigiria a REST de *pull request threads* com o token do build, e
  # escrever isso sem nunca poder executar contra um projeto real seria repetir
  # o erro que este arquivo ja cometeu tres vezes: codigo revisado, nunca rodado,
  # defeituoso na primeira execucao. Fica anotado como o primeiro passo de quem
  # adotar o Azure de verdade.
  #
  # O corpo ja esta montado — e a concatenacao dos laudos de todos os contratos,
  # produzida pelo passo anterior. So falta para onde mandar.
  - script: |
      if [ ! -s "$(Agent.TempDirectory)/comentario.md" ]; then
        echo "sem relatorio — a verificacao nao chegou a rodar" > "$(Agent.TempDirectory)/comentario.md"
      fi
      echo "##vso[task.uploadsummary]$(Agent.TempDirectory)/comentario.md"
    displayName: resumo
    condition: always()

  # A evidencia sobe **so quando reprova**, e nao a cada push — mesma regra da
  # esteira do GitHub, e pelo mesmo motivo.
  #
  # No caminho feliz ela e redundante: o laudo foi commitado na branch pelo
  # passo `aplicar` e o corpo dele ja esta no comentario. Guardar 226 KB por
  # contrato, por push, para duplicar o que esta no diff e custo sem leitor.
  #
  # Quando reprova de verdade e o oposto: sem proposta valida nao ha laudo a
  # registrar, e a saida bruta do container e o unico material que existe.
  #
  # DIVERGE: a retencao nao e do anexo, e da execucao inteira — vem da politica
  # do projeto, e nao deste arquivo. Uma organizacao que a encurte para dias
  # nao perde nada de auditoria: o laudo esta commitado ao lado do contrato, e
  # o trace guarda o sha256 de cada arquivo de evidencia. Aqui e depuracao.
  #
  # `5` — gate aberto — nao conta como reprovar: o laudo foi emitido e esta no
  # comentario. Codigo **vazio** conta, porque significa que a verificacao nem
  # chegou a rodar, e ai o anexo e o que sobra para depurar.
  - publish: evidence
    artifact: evidencia-$(Build.BuildId)
    condition: >-
      or(failed(),
         eq(variables['codigo'], ''),
         and(ne(variables['codigo'], '0'), ne(variables['codigo'], '5')))
    displayName: artefatos

  # `5` — gate aberto — nao reprova: falta decisao humana, e quem segura o merge
  # e a branch policy exigindo revisor obrigatorio por caminho.
  - script: |
      case "$(codigo)" in
        0) echo "contrato aprovado na verificacao automatica" ;;
        5) echo "##vso[task.logissue type=warning]aguardando decisao humana" ;;
        *) echo "##vso[task.logissue type=error]verificacao reprovou (exit $(codigo))"; exit 1 ;;
      esac
    displayName: veredito
