# Convencao de nome de branch.
#
# Este e o unico check do repositorio que reprova por **processo** em vez de
# conteudo, e o unico com regra escrita em YAML. A excecao e deliberada: as
# regras falam de git, nao de contrato de dados. O binario nunca ve um nome de
# branch nem um modo de arquivo, e nao deveria ver — `check` responde sobre o
# contrato, e so.
#
# Duas regras moram aqui:
#
#   nome da branch          a regra esta em docs/git-flow.md
#   bit de execucao do .sh  a regra estava so num comentario, e falhou
#
# Roda em segundos e sem container, e e por isso que cabe a ele carregar o que
# nao vale um job proprio.

name: convencao

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch:
    runs-on: ubuntu-latest
    steps:
      - name: nome da branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # POSIX ERE. `feat/202608/verificacao-em-pull-request`:
          #   tipo   — diz o que a branch e antes de alguem abrir o diff
          #   aaaamm — mes de abertura, mes valido (01-12)
          #   descr  — kebab-case minusculo, sem hifen duplo nem nas pontas
          padrao='^(feat|fix|docs|chore)/[0-9]{4}(0[1-9]|1[0-2])/[a-z0-9]+(-[a-z0-9]+)*$'

          if echo "$BRANCH" | grep -Eq "$padrao"; then
            echo "::notice::branch \`$BRANCH\` segue a convencao"
            exit 0
          fi

          # A mensagem carrega a correcao inteira. Um erro de processo que
          # obriga a pessoa a abrir a documentacao para descobrir o formato
          # custa mais que o erro.
          echo "::error::branch \`$BRANCH\` fora da convencao — o formato e \`<tipo>/<aaaamm>/<descricao-em-kebab-case>\`, por exemplo \`feat/$(date +%Y%m)/gate-humano-em-lacuna\`. Tipos: feat, fix, docs, chore. Ver docs/git-flow.md"
          echo
          echo "  git branch -m $BRANCH <novo-nome>"
          echo "  git push -u origin <novo-nome>"
          echo "  gh pr create --base main --fill"
          echo
          echo "O head de um pull request nao se renomeia: este PR precisa ser"
          echo "fechado e reaberto na branch nova. E o motivo de este check ser"
          echo "o primeiro do arquivo — errar o nome custa mais depois."
          exit 1

      # O checkout so e necessario a partir daqui: a regra de nome le
      # `github.head_ref` do evento e nao toca no disco.
      - uses: actions/checkout@v4

      # No Windows `core.fileMode` e `false`, entao `chmod +x` local nao vira
      # commit. Script que chega ao runner como 100644 falha com "permission
      # denied", tres passos de distancia da causa.
      #
      # **Isto ja estava escrito em prosa no `.gitattributes`, e nao funcionou.**
      # `package-vocabulario.sh` nasceu com 644 depois do aviso e derrubou o
      # primeiro `vocab-v1.1.0`. Quem escreve o script seguinte nao esta lendo o
      # `.gitattributes` — por isso a regra virou verificacao.
      #
      # `git ls-files -s` le o **indice**, e nao o disco: e o modo que foi
      # commitado que importa, e ele e o mesmo em qualquer plataforma.
      - name: script com bit de execucao
        run: |
          # `|| true` porque `grep` sem casamento sai 1, e a atribuicao propaga
          # o codigo para o `-e` do shell do Actions.
          faltando=$(git ls-files -s '*.sh' | grep '^100644' | cut -f2- || true)

          if [ -z "$faltando" ]; then
            echo "::notice::todo \`.sh\` versionado tem bit de execucao"
            exit 0
          fi

          # A mensagem carrega a correcao inteira, mesmo criterio da regra de
          # nome: erro de processo que obriga a abrir a documentacao custa mais
          # que o erro.
          echo "::error::script versionado sem bit de execucao — chega ao runner como 100644 e falha com 'permission denied'. Corrija com \`git update-index --chmod=+x <arquivo>\` e commite."
          echo
          echo "$faltando" | while IFS= read -r arquivo; do
            echo "  git update-index --chmod=+x $arquivo"
          done
          echo
          exit 1
