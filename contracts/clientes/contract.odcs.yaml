apiVersion: v3.1.0
kind: DataContract
id: clientes
name: Clientes (dataset sintetico)
version: 1.0.0
status: draft
description:
  purpose: Dataset sintetico de clientes para exercitar o harness de classificacao de privacidade.
  usage: Uso exclusivo em desenvolvimento. Nenhum dado real ou de producao.
  limitations: Todos os registros sao gerados artificialmente e nao correspondem a pessoas reais.
schema:
- name: clientes
  description: Cadastro de clientes.
  properties:
  - name: id_cliente
    logicalType: string
    description: Identificador interno pseudonimizado do cliente.
    required: true
    unique: true
    classification: confidential
    tags:
    - pii
    authoritativeDefinitions:
    - url: glossary/glossario.yaml#pessoa.identificador_interno
      type: businessDefinition
  - name: nome_completo
    logicalType: string
    description: Nome civil completo do cliente.
    required: true
    classification: confidential
    tags:
    - pii
    authoritativeDefinitions:
    - url: glossary/glossario.yaml#pessoa.nome_completo
      type: businessDefinition
  - name: cpf
    logicalType: string
    description: Cadastro de Pessoa Fisica, 11 digitos, sem formatacao.
    required: true
    classification: restricted
    tags:
    - pii
    authoritativeDefinitions:
    - url: glossary/glossario.yaml#pessoa.cpf
      type: businessDefinition
  - name: email
    logicalType: string
    description: Endereco de e-mail de contato.
    required: true
    classification: confidential
    tags:
    - pii
    authoritativeDefinitions:
    - url: glossary/glossario.yaml#contato.email
      type: businessDefinition
  - name: data_nascimento
    logicalType: date
    description: Data de nascimento do cliente.
    classification: confidential
    tags:
    - pii
    authoritativeDefinitions:
    - url: glossary/glossario.yaml#pessoa.data_nascimento
      type: businessDefinition
  - name: cep
    logicalType: string
    description: Codigo de endereçamento postal de residencia, 8 digitos.
    classification: confidential
    tags:
    - pii
    authoritativeDefinitions:
    - url: glossary/glossario.yaml#endereco.cep
      type: businessDefinition
  - name: segmento
    logicalType: string
    description: Faixa comercial atribuida pela area de marketing.
    classification: confidential
    tags:
    - pii
    authoritativeDefinitions:
    - url: glossary/glossario.yaml#perfil.segmento
      type: businessDefinition
  - name: data_cadastro
    logicalType: date
    description: Data em que o cadastro foi criado.
    classification: internal
    authoritativeDefinitions:
    - url: glossary/glossario.yaml#cadastro.data_criacao
      type: businessDefinition
  - name: valor_total_compras
    logicalType: number
    description: Soma historica das compras do cliente, em reais.
    classification: confidential
    tags:
    - pii
    authoritativeDefinitions:
    - url: glossary/glossario.yaml#perfil.valor_total_compras
      type: businessDefinition
