apiVersion: v3.1.0
kind: DataContract
id: pedidos
name: Pedidos (colecao MongoDB sintetica)
version: 1.0.0
status: draft
description:
  purpose: Colecao sintetica de pedidos em MongoDB, com documento aninhado, para exercitar a cobertura do harness sobre estruturas nao planas.
  usage: Uso exclusivo em desenvolvimento. Nenhum dado real ou de producao.
  limitations: Todos os registros sao gerados artificialmente e nao correspondem a pessoas reais.
schema:
- name: pedidos
  logicalType: object
  physicalType: collection
  description: Um documento por pedido.
  properties:
  - name: _id
    logicalType: string
    physicalType: objectId
    description: Identificador do documento, gerado pelo MongoDB.
    required: true
    unique: true
  - name: data_pedido
    logicalType: date
    description: Momento em que o pedido foi criado.
    required: true
  - name: valor_total
    logicalType: number
    description: Valor total do pedido em reais.
    required: true
  - name: cliente
    logicalType: object
    description: Dados do cliente, embutidos no documento do pedido — padrao comum em MongoDB para evitar join.
    required: true
    properties:
    - name: cpf
      logicalType: string
      description: CPF do cliente.
      required: true
    - name: nome_completo
      logicalType: string
      description: Nome civil do cliente.
      required: true
    - name: email
      logicalType: string
      description: Endereco de e-mail do cliente.
      required: false
  - name: entregas
    logicalType: array
    description: Tentativas de entrega do pedido.
    items:
      logicalType: object
      properties:
      - name: cep
        logicalType: string
        description: CEP do endereco de entrega.
      - name: data_nascimento_recebedor
        logicalType: date
        description: Data de nascimento de quem recebeu, coletada na entrega.
